<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <radialGradient id="orb1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#4318ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4318ff" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <circle cx="20%" cy="30%" r="600" fill="url(#orb1)" filter="url(#glow)"/>
  <circle cx="80%" cy="80%" r="500" fill="url(#orb2)" filter="url(#glow)"/>
  
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <g stroke="#a5b4fc" stroke-width="1.5" stroke-opacity="0.15" fill="none" stroke-linecap="round">
    <path d="M0,800 Q400,600 960,800 T1920,500" />
    <path d="M0,900 Q600,1000 1200,800 T1920,950" />
    <path d="M0,200 Q500,100 1000,300 T1920,150" opacity="0.5"/>
  </g>

  <g fill="white" fill-opacity="0.3">
    <circle cx="400" cy="650" r="3" />
    <circle cx="960" cy="800" r="4" />
    <circle cx="1500" cy="300" r="2" />
    <circle cx="1200" cy="800" r="3" />
    <circle cx="200" cy="200" r="2" />
    <circle cx="1800" cy="500" r="3" />
  </g>
</svg>