    <style>
      .chat-wrapper {
        height: calc(100vh - 120px);
        display: flex;
        background: white;
        border: 1px solid #ddd;
      }
      .chat-list {
        width: 280px;
        border-right: 1px solid #ddd;
        overflow-y: auto;
        background: #f8f9fa;
      }
      .chat-box {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        background: #fff;
      }
      .project-item {
        padding: 15px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
      }
      .project-item:hover,
      .project-item.active {
        background: #e2e6ea;
        border-left: 4px solid #007bff;
      }

      .dark-mode .chat-wrapper {
        background: #343a40;
        border-color: #4b545c;
      }
      .dark-mode .chat-list {
        background: #343a40;
        border-right: 1px solid #4b545c;
      }
      .dark-mode .chat-messages {
        background: #343a40;
        color: #fff;
      }
      .dark-mode .chat-header-custom {
        background: #3f474e !important;
        border-bottom: 1px solid #4b545c !important;
        color: #fff !important;
      }
      .dark-mode .project-item {
        border-bottom: 1px solid #4b545c;
      }
      .dark-mode .project-item h6 {
        color: #fff !important;
      }
      .dark-mode .project-item:hover, 
      .dark-mode .project-item.active {
        background: #3f474e;
        border-left-color: #39cccc;
      }
      .dark-mode .text-muted {
        color: #ced4da !important;
      }
      .dark-mode .text-dark {
        color: #fff !important;
      }
    </style>
  </head>
  <body class="hold-transition sidebar-mini">

    <div class="wrapper">

      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
          </li>
        </ul>
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="#" role="button" id="darkModeToggle">
              <i class="fas fa-moon"></i>
            </a>
          </li>
          <li class="nav-item dropdown user-menu">
            <a href="#" class="nav-link dropdown-toggle" data-toggle="dropdown">
              <img src="https://placehold.co/160x160/007bff/ffffff?text=U" id="userAvatarSmall" class="user-image img-circle elevation-2" alt="User Image">
              <span class="d-none d-md-inline" id="userNameSmall">Cargando...</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-right">
              <li class="user-header bg-primary">
                <img src="https://placehold.co/160x160/007bff/ffffff?text=U" id="userAvatarLarge" class="img-circle elevation-2" alt="User Image">
                <p id="userNameLarge">Cargando...<small>Miembro del equipo</small></p>
              </li>
              <li class="user-footer">
                <a href="../nuevo/profile.html" class="btn btn-default btn-flat">Perfil</a>

                <a href="#" id="logoutBtn" class="btn btn-default btn-flat float-right">Cerrar Sesión</a>
              </li>
            </ul>
          </li>
        </ul>
      </nav>
    
      <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a href="index.html" class="brand-link">
          <span class="brand-text font-weight-light"><b>Gestor</b>DAW</span>
        </a>

        <div class="sidebar">
          <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
              <li class="nav-item">
                <a href="index.html" class="nav-link">
                  <i class="nav-icon fas fa-tachometer-alt"></i>
                  <p>Dashboard</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="../nuevo/projects.html" class="nav-link">

                  <i class="nav-icon fas fa-folder"></i>
                  <p>Proyectos</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="chat.html" class="nav-link active">
                  <i class="nav-icon fas fa-comments"></i>
                  <p>Chat Global</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="calendar.html" class="nav-link">
                  <i class="nav-icon fas fa-calendar-alt"></i>
                  <p>Calendario</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="../nuevo/profile.html" class="nav-link">

                  <i class="nav-icon fas fa-user-cog"></i>
                  <p>Mi Perfil</p>
                </a>
              </li>

          </nav>

      <div class="content-wrapper">

        <section class="content-header">
          <div class="container-fluid">
            <h1>Centro de Mensajes</h1>
          </div>
        </section>

        <section class="content">
          <div class="container-fluid">
            <div
              class="card card-primary card-outline direct-chat direct-chat-primary"
            >
              <div class="card-body p-0">
                <div class="chat-wrapper">
                  <div class="chat-list" id="projectsList">
                    <div class="text-center p-3 text-muted">Cargando...</div>
                  </div>

                  <div class="chat-box">
                    <div
                      id="chatHeader"
                      class="p-3 border-bottom bg-light font-weight-bold chat-header-custom"
                      style="display: none"
                    >
                      Selecciona un proyecto
                    </div>
                    <div
                      id="messagesArea"
                      class="chat-messages direct-chat-messages"
                    >
                      <div
                        class="h-100 d-flex align-items-center justify-content-center text-muted"
                      >
                        <i class="fas fa-comments fa-3x mb-3"></i><br />
                        Selecciona un proyecto para chatear
                      </div>
                    </div>
                    <div
                      class="card-footer"
                      id="inputArea"
                      style="display: none"
                    >
                      <form id="chatForm">
                        <div class="input-group">
                          <input
                            type="text"
                            id="messageInput"
                            placeholder="Escribir mensaje..."
                            class="form-control"
                          />
                          <span class="input-group-append">
                            <button type="submit" class="btn btn-primary">
                              Enviar

                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

      <footer class="main-footer">
        <strong

        >
      </footer>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="../../js/app.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/js/adminlte.min.js"></script>

    <script type="module">
      import * as apiService from '../../js/api-service.js';

      const socket = io(); 
      let currentProjectId = null;
      let currentUser = null;

      async function initChat() {
          try {
              const storedUser = localStorage.getItem("user");
              if (storedUser) {
                  currentUser = JSON.parse(storedUser);
              }
              
              if (!currentUser) {
                  currentUser = await apiService.getMiPerfil();
                  localStorage.setItem("user", JSON.stringify(currentUser));
              }

              if (!currentUser) {
                 throw new Error("No se pudo identificar al usuario");
              }

              loadProjects();

          } catch (err) {
              console.error(err);
              document.getElementById("projectsList").innerHTML = 
                  `<div class="text-danger p-3">Error de autenticación. <a href="../auth/login.html">Login</a></div>`;
          }
      }

      const urlParams = new URLSearchParams(window.location.search);
      const targetProjectId = urlParams.get("projectId");

      async function loadProjects() {
        try {
          const list = document.getElementById("projectsList");
          list.innerHTML = '<div class="text-center p-3 text-muted">Cargando proyectos...</div>';

          const projects = await apiService.fetch("/projects");
          
          list.innerHTML = "";

          if (!projects || projects.length === 0) {
              list.innerHTML = '<div class="text-center p-3 text-muted">No tienes proyectos aún.</div>';
              return;
          }

          projects.forEach((p) => {
            const div = document.createElement("div");
            div.className = "project-item";

            if (targetProjectId && p.id == targetProjectId) {
              div.classList.add("active");
              selectProject(p.id, p.name);
            }

            div.innerHTML = `
                    <h6 class="m-0 text-dark">${p.name}</h6>
                    <small class="text-muted">${p.role}</small>
                `;
            div.onclick = () => {
              document
                .querySelectorAll(".project-item")
                .forEach((e) => e.classList.remove("active"));
              div.classList.add("active");
              selectProject(p.id, p.name);
            };
            list.appendChild(div);
          });
        } catch (error) {
          console.error(error);
          document.getElementById("projectsList").innerHTML = 
              `<div class="text-danger p-3">Error cargando proyectos: ${error.message}</div>`;
        }
      }

      async function selectProject(id, name) {
        currentProjectId = id;
        document.getElementById("chatHeader").innerText = name;
        document.getElementById("chatHeader").style.display = "block";
        document.getElementById("inputArea").style.display = "block";
        document.getElementById("messagesArea").innerHTML =
          '<div class="text-center p-3">Cargando...</div>';

        socket.emit("join_project", id);

        try {
          const msgs = await apiService.fetch(`/projects/${id}/messages`);
          renderMessages(msgs);
        } catch (e) {
          console.error(e);
        }
      }

      function renderMessages(messages) {
        const area = document.getElementById("messagesArea");
        area.innerHTML = "";
        messages.forEach((msg) => appendMessage(msg));
        area.scrollTop = area.scrollHeight;
      }

      function appendMessage(data) {
        const area = document.getElementById("messagesArea");
        const isMe = data.user_id == currentUser.id;
        
        const name = isMe ? currentUser.name : (data.name || data.userName || "Usuario");
        
        
        let avatarUrl = "https://placehold.co/128x128?text=" + name.charAt(0);
        if (isMe && currentUser.avatar_url) {
            avatarUrl = currentUser.avatar_url;
        } else if (!isMe && data.avatar_url) {
            avatarUrl = data.avatar_url;
        }

        const alignClass = isMe ? "right" : "left";
        const nameFloat = isMe ? "float-right" : "float-left";
        const timeFloat = isMe ? "float-left" : "float-right";

        const html = `
            <div class="direct-chat-msg ${alignClass}">
                <div class="direct-chat-infos clearfix">
                    <span class="direct-chat-name ${nameFloat}">${name}</span>
                    <span class="direct-chat-timestamp ${timeFloat}">${new Date(data.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                </div>
                <img class="direct-chat-img" src="${avatarUrl}" alt="User Image">
                <div class="direct-chat-text">
                    ${data.message}
                </div>
            </div>
        `;
        area.insertAdjacentHTML("beforeend", html);
        area.scrollTop = area.scrollHeight;
      }

      document.getElementById("chatForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("messageInput");
        if (!input.value.trim() || !currentProjectId) return;

        socket.emit("send_message", {
          projectId: currentProjectId,
          userId: currentUser.id,
          userName: currentUser.name,
          avatar_url: currentUser.avatar_url,
          message: input.value,
        });
        input.value = "";
      });

      socket.on("receive_message", (data) => {
        if (data.projectId == currentProjectId) appendMessage(data);
      });

      initChat();

    </script>
  </body>
</html>
