<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificar Cuenta | GestorDAW</title>
    <link rel="icon" type="image/png" href="../../img/favicon.png">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/modern-theme.css">
  </head>
  <body class="hold-transition login-page">
    <div class="login-box">
      <div class="card card-outline card-primary">
        <div class="card-header text-center">
          <a href="#" class="h1"><b>Gestor</b>DAW</a>
        </div>
        <div class="card-body">
          <p class="login-box-msg">
            Introduce el código que te llegó al correo
          </p>

          <form id="verifyForm">
            <div class="input-group mb-3">
              <input
                type="text"
                class="form-control"
                id="tokenInput"
                placeholder="Pega tu código aquí"
                required
              />
              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-key"></span>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <button type="submit" class="btn btn-primary btn-block">
                  Verificar Cuenta
                </button>
              </div>
            </div>
          </form>

          <div
            id="verifyMessage"
            class="mt-3 text-center"
            style="display: none"
          ></div>
          <p class="mt-3 mb-1 text-center">
            <a href="login.html">Volver al Login</a>
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/js/adminlte.min.js"></script>

    <script type="module">
      import { verifyAccount } from "../../js/api-service.js";
      import "../../js/app.js";

      if (localStorage.getItem("darkMode") === "enabled") {
        document.body.classList.add("dark-mode");
      }

     
      const urlParams = new URLSearchParams(window.location.search);
      const tokenUrl = urlParams.get("token");
      if (tokenUrl) {
        document.getElementById("tokenInput").value = tokenUrl;
      }

      
      document
        .getElementById("verifyForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const token = document.getElementById("tokenInput").value;
          const msgDiv = document.getElementById("verifyMessage");
          const btn = e.target.querySelector("button");

          const textoOriginal = btn.textContent;
          btn.disabled = true;
          btn.textContent = "Verificando...";

          try {
            const res = await verifyAccount(token);

            msgDiv.style.display = "block";
            msgDiv.className = "mt-3 text-center text-success font-weight-bold";
            msgDiv.innerHTML = `<i class="fas fa-check-circle"></i> ${res.message}<br>Redirigiendo...`;

            setTimeout(() => {
              window.location.href = "login.html";
            }, 2000);
          } catch (error) {
      
            btn.disabled = false;
            btn.textContent = textoOriginal;
            msgDiv.style.display = "block";
            msgDiv.className = "mt-3 text-center text-danger";
            msgDiv.textContent = error.message || "Código inválido o expirado";
          }
        });
    </script>
  </body>
</html>
