<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recuperar Contraseña | GestorDAW</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">
  <link rel="stylesheet" href="../../assets/css/modern-theme.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="hold-transition login-page">
  <div class="login-box">
    <div class="card card-outline card-primary">
      <div class="card-header text-center">
        <a href="#" class="h1"><b>Gestor</b>DAW</a>
      </div>
      <div class="card-body">
        <p class="login-box-msg">¿Olvidaste tu contraseña? Introduce tu email.</p>
        <form id="forgotForm">
          <div class="input-group mb-3">
            <input type="email" class="form-control" id="email" placeholder="Email" required>
            <div class="input-group-append">
              <div class="input-group-text"><span class="fas fa-envelope"></span></div>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <button type="submit" class="btn btn-primary btn-block">Enviar Enlace</button>
            </div>
          </div>
        </form>
        <div id="message" class="mt-3 text-center" style="display:none;"></div>
        <p class="mt-3 mb-1">
          <a href="login.html">Volver al Login</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { forgotPassword } from '../../js/api-service.js';

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const msgDiv = document.getElementById('message');
      const btn = e.target.querySelector('button');

      btn.disabled = true;
      btn.textContent = "Enviando...";

      try {
        const res = await forgotPassword(email);
        msgDiv.style.display = 'block';
        msgDiv.className = 'text-success mt-3';
        msgDiv.textContent = res.message;
        btn.textContent = "Enviado";
      } catch (error) {
        msgDiv.style.display = 'block';
        msgDiv.className = 'text-danger mt-3';
        msgDiv.textContent = error.message;
        btn.disabled = false;
        btn.textContent = "Enviar Enlace";
      }
    });
  </script>
</body>
</html>
