<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva Contraseña | GestorDAW</title>
  <link rel="icon" type="image/png" href="../../img/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">
  <link rel="stylesheet" href="../../assets/css/modern-theme.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="hold-transition login-page">
  <div class="login-box">
    <div class="card card-outline card-primary">
      <div class="card-header text-center">
        <a href="#" class="h1"><b>Gestor</b>DAW</a>
      </div>
      <div class="card-body">
        <p class="login-box-msg">Estás a un paso de tu nueva contraseña.</p>
        <form id="resetForm">
          <div class="input-group mb-3">
            <input type="password" class="form-control" id="password" placeholder="Nueva Contraseña" required minlength="6">
            <div class="input-group-append">
              <div class="input-group-text"><span class="fas fa-lock"></span></div>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <button type="submit" class="btn btn-primary btn-block">Cambiar Contraseña</button>
            </div>
          </div>
        </form>
        <div id="message" class="mt-3 text-center" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { resetPassword } from '../../js/api-service.js';

    // Dark Mode Check
    if (localStorage.getItem("darkMode") === "enabled") {
      document.body.classList.add("dark-mode");
    }

    // Obtener token de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.body.innerHTML = "<h3 class='text-center mt-5'>Error: Falta el token de seguridad.</h3>";
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('password').value;
      const msgDiv = document.getElementById('message');
      
      try {
        const res = await resetPassword(token, newPassword);
        msgDiv.style.display = 'block';
        msgDiv.className = 'text-success mt-3';
        msgDiv.innerHTML = `${res.message} <br> <a href="login.html">Iniciar Sesión</a>`;
        e.target.style.display = 'none'; // Ocultar form
      } catch (error) {
        msgDiv.style.display = 'block';
        msgDiv.className = 'text-danger mt-3';
        msgDiv.textContent = error.message;
      }
    });
  </script>
</body>
</html>
